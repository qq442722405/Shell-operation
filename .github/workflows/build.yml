name: 构建 APP窗口容器 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载项目
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 JDK 17
      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 设置 Android SDK
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      # 4. 安装 Android SDK 组件
      - name: 安装 Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. 创建 Gradle Wrapper
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. 编译 Debug APK
      - name: 编译 APK
        run: |
          gradle assembleDebug --no-daemon

      # 7. 重命名 APK
      - name: 重命名 APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/APP窗口容器.apk

      # 8. 上传 APK
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: APP窗口容器
          path: output/APP窗口容器.apk
          if-no-files-found: error
