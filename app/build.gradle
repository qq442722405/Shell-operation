plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.appwindowcontainer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.appwindowcontainer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
